<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Around the World - My virtual record collection</title>
    <link rel="icon" href="favicon.jpg" type="image/jpg">
    <link rel="stylesheet" href="css/style.css?v=5">
    <script src="js/nav.js?v=4" defer></script>
</head>
<body data-nav="music" data-sub="records">
    <div id="site-nav" data-root=""></div>
    <h1 class="main-title">My virtual record collection</h1>

    <div class="stat-display">
        <span id="statText">0 records from 0 countries</span>
    </div>

    <p class="subtitle">Highlights from this collection: <a href="playlists/highlights.html">the highlights playlist</a></p>


    <nav class="filter-bar filter-static">
<div class="filter-group sort">
            <label for="sortFilter">Sort</label>
            <select id="sortFilter">
                <option value="alpha">Country A–Z</option>
                <option value="date">National Day</option>
            </select>
        </div>
<div class="filter-group continent">
            <label for="continentFilter">Continent</label>
            <select id="continentFilter">
                <option value="all">All</option>
                <option value="Africa">Africa</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="North America">North America</option>
                <option value="South America">South America</option>
                <option value="Oceania">Oceania</option>
            </select>
        </div>
</nav>

<nav class="filter-bar filter-sticky">
<div class="filter-group search">
            <label for="searchInput">Search</label>
            <input type="text" id="searchInput" placeholder="Find a country, artist or album...">
        </div>
<div class="filter-group random">
            <button id="randomPicker">Random entry</button>
        </div>
</nav>

    <div class="container">
        <div id="musicList" class="music-list"></div>
    </div>

    <script src="js/script.js"></script>

    <footer style="text-align: center;">
    <p>Open-source personal web project built by me, Chris Jones (stopherjones). For more information, see <a href="https://stopherjones.github.io/about.html">About Me</a></p>
    </footer>

</body>
</html>
