<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Around the World in books and music</title>
    <link rel="icon" href="favicon.jpg" type="image/jpg">
    <link rel="stylesheet" href="css/style.css?v=5">
    <meta name="google-site-verification" content="z9n0lhtaop9VH_-yYuA5LYSZueR5IFPOXtmz3ffvnMw" />
    <script src="js/nav.js?v=4" defer></script>
</head>

<body data-nav="gallery">
    <div id="site-nav" data-root=""></div>

    <h1 class="main-title">Around the world in books and music</h1>

    <div class="stat-display">
        <span id="statText">0 entries from 0 of 0 countries</span>
    </div>

    <p class="subtitle">Click on coloured-in flags to see which books I've read or music I've listened to from those
        countries.</p>

    <!-- Sticky Nav Bar -->
    <nav class="filter-bar">
        <div class="filter-group content-type">
            <label>Show Books or Music:</label>
            <div class="checkbox-group">
                <label>Books <input type="checkbox" id="filterBooks" checked></label>
                <label>Music <input type="checkbox" id="filterMusic" checked></label>
            </div>
        </div>

        <div class="filter-group continent">
            <label for="continentFilter">Continent</label>
            <select id="continentFilter">
                <option value="all">All</option>
                <option value="Africa">Africa</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="North America">North America</option>
                <option value="South America">South America</option>
                <option value="Oceania">Oceania</option>
            </select>
        </div>

        <div class="filter-group search">
            <label for="searchInput">Search</label>
            <input type="text" id="searchInput" placeholder="Find a country...">
        </div>
    </nav>

    <!-- Gallery -->
    <div id="gallery" class="gallery"></div>

    <script src="js/script.js"></script>

    <footer style="text-align: center;">
    <p>Open-source personal web project built by me, Chris Jones (stopherjones). For more information, see <a href="https://stopherjones.github.io/about.html">About Me</a></p>
</footer>
</body>

</html>
