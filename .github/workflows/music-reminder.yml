name: Music Reminder

on:
  schedule:
    - cron: '0 1 * * *'  # 1am UTC daily - adjust to your timezone
  workflow_dispatch:       # allows manual trigger for testing

jobs:
  check-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stop before sending anything if a data file is malformed or has a bad date,
      # so a broken edit can't send a wrong reminder.
      - name: Validate data files
        run: |
          python3 tools/validate_data.py

      # Reads data/countries.json and data/events.json from the repo root
      - name: Check for today's music entries
        id: check
        run: |
          python3 .github/scripts/check_music.py

      - name: Send email
        if: steps.check.outputs.has_matches == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Music Reminder
          subject: ${{ steps.check.outputs.email_subject }}
          html_body: ${{ steps.check.outputs.email_body }}
