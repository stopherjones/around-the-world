<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Around the World books list</title>
    <link rel="icon" href="favicon.jpg" type="image/jpg">
    <link rel="stylesheet" href="css/style.css?v=5">
    <script src="js/nav.js?v=4" defer></script>
</head>
<body data-nav="books">
    <div id="site-nav" data-root=""></div>
    <h1 class="main-title">Books I've Read</h1>

    <div class="stat-display">
        <span id="statText">0 books read in 0 of 0 countries</span>
    </div>

    <p class="subtitle">A complete list of books organized by country of origin</p>

    <!-- Sticky Nav Bar -->
    <nav class="filter-bar filter-static">
<div class="filter-group sort">
            <label for="sortFilter">Sort</label>
            <select id="sortFilter">
                <option value="alpha">A–Z</option>
                <option value="recent">Most Recent</option>
            </select>
        </div>
<div class="filter-group continent">
            <label for="continentFilter">Continent</label>
            <select id="continentFilter">
                <option value="all">All</option>
                <option value="Africa">Africa</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="North America">North America</option>
                <option value="South America">South America</option>
                <option value="Oceania">Oceania</option>
            </select>
        </div>
</nav>

<nav class="filter-bar filter-sticky">
<div class="filter-group search">
            <label for="searchInput">Search</label>
            <input type="text" id="searchInput" placeholder="Find a country...">
        </div>
</nav>

    <div class="container">
        <div id="booksList" class="books-list"></div>
    </div>

    <script src="js/script.js"></script>
    <footer style="text-align: center;">
        <p>Open-source personal web project built by me, Chris Jones (stopherjones). For more information, see <a href="https://stopherjones.github.io/about.html">About Me</a></p>
    </footer>
    </body>
</html>
